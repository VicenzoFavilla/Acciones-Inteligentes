services:
  mongodb:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-example}
    volumes:
      - mongodb_data:/data/db
    networks:
      - bolsa_net

  backend:
    build: .
    container_name: python_backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - MONGO_URL=mongodb://root:example@mongodb:27017/acciones_ml?authSource=admin
    depends_on:
      - mongodb
    networks:
      - bolsa_net

networks:
  bolsa_net:

volumes:
  mongodb_data:
