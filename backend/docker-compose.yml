services:
  mongodb:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "8000:8000"
    networks:
      - bolsa_net

  backend:
    build: .
    container_name: python_backend
    ports:
      - "8001:8001"
    environment:
      # Asegúrate de que en tu código Python uses exactamente "MONGO_URL"
      - MONGO_URL=mongodb://mongo_db:27017/acciones_db
    depends_on:
      - mongodb
    networks:
      - bolsa_net

networks:
  bolsa_net:
