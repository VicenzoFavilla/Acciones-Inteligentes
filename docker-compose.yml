services:
  mongodb:
    image: mongo:6.0
    container_name: acciones_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-example}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - acciones_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acciones_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://root:example@mongodb:27017/acciones_ml?authSource=admin
      - MODEL_DIR=/app/models
      - LOG_LEVEL=INFO
      - LOG_FORMAT=JSON
      - SECRET_KEY=${SECRET_KEY:-super_secret_jwt_key_default_12345}
    volumes:
      - models_data:/app/models
      - reports_data:/app/reports
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - acciones_net

  # Servicio on-demand / batch para ejecutar el pipeline diario de ML y Backtesting
  ml_pipeline:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acciones_ml_pipeline
    profiles:
      - pipeline
    environment:
      - MONGO_URL=mongodb://root:example@mongodb:27017/acciones_ml?authSource=admin
      - MODEL_DIR=/app/models
      - LOG_LEVEL=INFO
      - LOG_FORMAT=TEXT
    volumes:
      - models_data:/app/models
      - reports_data:/app/reports
    depends_on:
      mongodb:
        condition: service_healthy
    command: ["python", "scripts/daily_ml_pipeline.py", "--tickers", "AAPL MSFT GOOGL AMZN NVDA TSLA", "--period", "2y"]
    networks:
      - acciones_net

networks:
  acciones_net:
    driver: bridge

volumes:
  mongodb_data:
  models_data:
  reports_data:
